<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.chip{font-size:12px;background:#f1f3f8;padding:3px 8px;border-radius:999px}.chip.g{background:#fff7e6;color:#a15c00}
.vend{margin-top:10px;font-size:12.5px;color:#41495b}.vend div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--line)}
.ev.fund{background:#fafbfd}.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--red2);color:var(--red);font-weight:700;margin-left:6px;vertical-align:middle}
.rules p{margin:5px 0;font-size:14px;line-height:1.55}.rules p.hd{font-weight:800;margin-top:14px;color:var(--red)}
footer{text-align:center;font-size:12px;color:var(--sub);padding:10px 0 30px}
.rank{display:flex;align-items:center;gap:8px;margin:7px 0}.rank .nm{width:58px;font-size:13px;font-weight:600}.rank .bg{flex:1;background:#eef0f5;border-radius:6px;height:18px;overflow:hidden}.rank .bg i{display:block;height:100%;background:#1d2433;border-radius:6px}.rank .cnt{width:34px;text-align:right;font-size:13px;font-weight:700}

<body>
<header><h1>🩸 혈풍 86계 대시보드</h1><p id="asof">불러오는 중…</p></header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <button class="tab on" data-t="pay">💰 회비</button>
    <button class="tab" data-t="meet">🍻 모임 기록</button>
    <button class="tab" data-t="rule">📜 회칙</button>
  </div>
  <div id="pay">
    <section><h2>연도별 회비 입금</h2><p class="hint">매년 통장에 들어온 회비 합계예요. (단위: 만원)</p><div class="bars" id="bars"></div></section>
    <section><h2>최근 12개월 납부 현황</h2><p class="hint">빨간 칸 = 납부 완료 · 노란 칸 = 미납 · 회색 = 아직 마감 전</p><div class="tw"><div class="heat" id="heat"></div></div></section>
    <section><h2>회원별 현황</h2><p class="hint">누계 = 지금까지 낸 회비 / 사용 = 모임·환급으로 쓴 몫</p><div class="tw"><table id="mt"></table></div></section>
  </div>
  <div id="meet" class="hide">
    <section><h2>모임 참석 순위</h2><p class="hint">정기모임·엠티 참석 횟수 기준이에요.</p><div id="rank"></div></section>
    <section><h2>모임 타임라인</h2><p class="hint">최근 모임이 위에 있어요.</p><div class="tl" id="tl"></div></section>
  </div>
  <div id="rule" class="hide"><section class="rules" id="rules"></section></div>
</main>
<footer>총무가 장부를 고치면 이 화면에 자동 반영됩니다 · 계좌번호 등 개인정보는 표시하지 않아요</footer>

<script>
// ★★★ 설정: 같은 폴더의 data.xlsx(장부 복사본)를 자동으로 읽어요 ★★★
const DATA_URL = "data.xlsx";
</script>
<script>// ===== 장부(시트 배열) → 대시보드 데이터 변환 =====
function parseBook(book, today) {
  const S = v => (v === null || v === undefined) ? '' : String(v).trim();
  const N = v => (typeof v === 'number') ? v : (S(v) !== '' && !isNaN(Number(S(v).replace(/,/g, ''))) ? Number(S(v).replace(/,/g, '')) : null);
  const find = (rows, test) => { for (let r = 0; r < rows.length; r++) { const row = rows[r] || []; for (let c = 0; c < row.length; c++) if (test(S(row[c]), r, c)) return [r, c]; } return null; };
  const numRight = (rows, r, c) => { const row = rows[r] || []; for (let k = c + 1; k < row.length; k++) { const n = N(row[k]); if (n !== null) return n; } return null; };

  const ledgerName = Object.keys(book).find(k => k.includes('장부'));
  const L = book[ledgerName] || [];
  const res = { members: [], months: [], events: [], totals: {}, rules: [] };

  // ---- 회비 납부 표 ----
  const h = find(L, s => s === '명단');
  const hr = h[0], nameCol = h[1];
  const yearRow = L[hr] || [], monthRow = L[hr + 1] || [];
  let curY = null; const mcols = [];
  for (let c = nameCol + 1; c < Math.max(yearRow.length, monthRow.length); c++) {
    const y = N(yearRow[c]); if (y && y > 2000 && y < 2100) curY = y;
    const m = N(monthRow[c]);
    if (curY && m && m >= 1 && m <= 12) mcols.push({ c, y: curY, m });
  }
  res.months = mcols.map(x => ({ y: x.y, m: x.m }));
  const totCol = nameCol + 2; // 회비 납부 누계
  const cutoff = today.getFullYear() * 12 + today.getMonth(); // 지난달까지(0-based month → 이전달)
  for (let r = hr + 2; r < L.length; r++) {
    const name = S((L[r] || [])[nameCol]);
    if (!name || name.startsWith('절사') || name.startsWith('합')) break;
    const pays = mcols.map(x => { const v = (L[r] || [])[x.c]; return { y: x.y, m: x.m, v: N(v), t: S(v) }; });
    const firstIdx = pays.findIndex(p => p.v && p.v > 0);
    const paid = pays.reduce((a, p) => a + (p.v || 0), 0);
    let missing = 0, lastPaid = null;
    pays.forEach((p, i) => {
      if (p.v && p.v > 0) lastPaid = p;
      const idx = p.y * 12 + (p.m - 1);
      if (i >= firstIdx && firstIdx >= 0 && idx < cutoff && !(p.v > 0)) missing++;
    });
    const join = firstIdx > 0 ? pays[firstIdx] : null;
    res.members.push({ name, auto: S((L[r] || [])[nameCol + 1]), total: N((L[r] || [])[totCol]) || paid, pays, missing, lastPaid, join, used: 0, attend: 0 });
  }

  // ---- 총계 ----
  const pick = label => { const p = find(L, s => s.replace(/\s/g, '').startsWith(label)); return p ? numRight(L, p[0], p[1]) : null; };
  res.totals.income = pick('총계(A)');
  res.totals.spent = pick('총계(B)');
  res.totals.balance = pick('계좌잔액');
  const ip = find(L, s => s === '이자'); res.totals.interest = ip ? numRight(L, ip[0], ip[1]) : null;
  const sumRowP = find(L, (s, r) => r < hr + 2 + res.members.length + 3 && s.replace(/\s/g, '') === '합계');
  res.totals.monthly = sumRowP ? mcols.map(x => N((L[sumRowP[0]] || [])[x.c]) || 0) : [];

  // ---- 사용 내역(모임) 표 ----
  const uh = find(L, (s, r) => r > hr && s === '사용액');
  const events = [];
  if (uh) {
    const ur = uh[0], uNameCol = uh[1] - 1;
    const titleRow = L[ur - 1] || [], labRow = L[ur] || [];
    const memRows = []; let nonMemberRow = null, totalRow = null;
    for (let r = ur + 1; r < L.length; r++) {
      const a = S((L[r] || [])[uNameCol]), b = S((L[r] || [])[uNameCol - 1]);
      if (b.replace(/\s/g, '') === '합계') { totalRow = r; break; }
      if (b.includes('비회원')) nonMemberRow = r;
      else if (a) memRows.push({ r, name: a });
    }
    memRows.forEach(m => { const mm = res.members.find(x => x.name === m.name); if (mm) mm.used = N((L[m.r] || [])[uh[1]]) || 0; });
    const sub = /^(참석|금액|환급|사용|교통|총|개인)/;
    const maxC = Math.max(titleRow.length, labRow.length);
    for (let c = uh[1] + 1; c < maxC; c++) {
      let title = S(titleRow[c]); const lab = S(labRow[c]);
      if (!title && lab && !sub.test(lab)) title = lab;
      if (!title) continue;
      const below = S((L[ur + 1] || [])[c]);
      const hasAtt = lab.startsWith('참석') || below.startsWith('참석');
      const amtCol = hasAtt ? c + 1 : c;
      const att = [], absent = [];
      let total = 0;
      [...memRows, ...(nonMemberRow !== null ? [{ r: nonMemberRow, name: '비회원' }] : [])].forEach(m => {
        const code = S((L[m.r] || [])[c]);
        const amt = N((L[m.r] || [])[amtCol]) || 0;
        total += amt;
        if (hasAtt) { if (['1', 'O', 'o', '△', '3'].includes(code) || (code === '2' && amt > 0)) att.push(m.name); else if (m.name !== '비회원') absent.push(m.name); }
      });
      const t = title.split('\n');
      const dm = title.match(/\(?'?(\d{2})\.(\d{1,2})\.(\d{1,2})/) || title.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
      let date = null; if (dm) { let y = Number(dm[1]); if (y < 100) y += 2000; date = `${y}-${String(dm[2]).padStart(2, '0')}-${String(dm[3]).padStart(2, '0')}`; }
      const name = t[0].replace(/\(.*$/, '').replace(/'.*$/, '').trim() || t[0];
      const place = (t[1] || '').replace(/[()]/g, '').trim();
      const isFund = /비자금/.test(title);
      events.push({ name: isFund ? t[0].replace(/\s+/g,' ').trim() + (t[1] ? ' ' + t[1].replace(/\(.*$/, '').trim() : '') : name, _x: 0, date, place: isFund ? '' : place, total: Math.round(total), attendees: att, absent, type: isFund ? 'fund' : (/엠티|MT/.test(title) ? 'mt' : 'meet'), vendors: [] }); if (false) events.push({ name: isFund ? t.join(' ').replace(/\(.*\)/, '').trim() : name, date, place, total: Math.round(total), attendees: att.map(n => n === '비회원' ? '비회원' : n), absent, type: isFund ? 'fund' : (/엠티|MT/.test(title) ? 'mt' : 'meet'), vendors: [] });
    }
  }

  // ---- 개별 모임 시트(N회 모임) 상세 덮어쓰기 ----
  Object.keys(book).forEach(sn => {
    if (!/회\s*모임/.test(sn)) return;
    const R = book[sn];
    const tp = find(R, s => s.replace(/\s/g, '') === '총계');
    const ip2 = find(R, s => s.replace(/\s/g, '').startsWith('인당') || s.includes('인당금액'));
    if (!tp || !ip2) return;
    const people = []; const per = {};
    for (let r = 0; r < tp[0]; r++) {
      const row = R[r] || [];
      for (let c = 1; c < row.length; c++) {
        const s = S(row[c]);
        if (s === '회원' || s === '비회원') {
          const nm = S(row[c - 1]);
          if (nm && !people.find(p => p.name === nm)) { people.push({ name: nm, member: s === '회원' }); per[nm] = N(row[ip2[1]]); }
          break;
        }
      }
    }
    const vendors = [];
    const hrow = R[ip2[0]] || [];
    for (let c = ip2[1] + 1; c < hrow.length; c++) {
      const lab = S(hrow[c]).replace(/\n/g, ' '); const v = N((R[tp[0]] || [])[c]);
      if (lab && !lab.startsWith('비고') && v) vendors.push({ name: lab, amt: v });
    }
    const total = N((R[tp[0]] || [])[ip2[1]]);
    const key = sn.replace(/\s/g, '');
    let ev = events.find(e => e.name.replace(/\s/g, '') === key);
    if (!ev) { ev = { name: sn, date: null, place: '', type: 'meet' }; events.push(ev); }
    ev.total = total; ev.vendors = vendors;
    ev.attendees = people.map(p => p.member ? p.name : p.name + '(비회원)');
    ev.absent = res.members.map(m => m.name).filter(n => !people.find(p => p.name === n));
    ev.per = per;
    if (!ev.place && vendors.length) { const top = vendors.slice().sort((a, b) => b.amt - a.amt)[0]; ev.place = top.name.replace(/\(.*\)/, '').trim(); }
  });
  events.sort((a, b) => (a.date || '9') < (b.date || '9') ? -1 : 1);
  res.events = events;
  res.members.forEach(m => { m.attend = events.filter(e => e.type !== 'fund' && e.attendees.includes(m.name)).length; });

  // ---- 회칙 ----
  const rn = Object.keys(book).find(k => k.includes('회칙'));
  if (rn) { const R = book[rn]; let on = false; R.forEach(row => (row || []).forEach(v => { const s = S(v); if (s.includes('회칙') && s.startsWith('-')) { on = true; return; } if (on && s) res.rules.push(s); })); }
  return res;
}
if (typeof module !== 'undefined') module.exports = parseBook;

const won = v => (v == null ? '-' : Math.round(v).toLocaleString('ko-KR') + '원');
const man = v => (v == null ? '-' : (v >= 10000 ? (Math.round(v / 1000) / 10).toLocaleString('ko-KR') + '만' : Math.round(v).toLocaleString('ko-KR')));
const $ = id => document.getElementById(id);

function render(d, source) {
  const now = new Date();
  $('asof').textContent = `${source} · ${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()} 확인`;
  const lastY = now.getFullYear(), lastM = now.getMonth() + 1;
  const thisPaid = d.members.filter(m => m.pays.some(p => p.y === lastY && p.m === lastM && p.v > 0)).length;
  const meets = d.events.filter(e => e.type !== 'fund');
  const lastMeet = meets[meets.length - 1];
  $('kpis').innerHTML = `
    <div class="kpi hero"><div class="l">현재 통장 잔액</div><div class="v">${won(d.totals.balance)}</div><div class="s">총 입금 − 총 사용</div></div>
    <div class="kpi"><div class="l">총 입금 (이자 포함)</div><div class="v">${man(d.totals.income)}원</div><div class="s">이자 ${won(d.totals.interest)}</div></div>
    <div class="kpi"><div class="l">총 사용</div><div class="v">${man(d.totals.spent)}원</div><div class="s">모임·엠티·환급</div></div>
    <div class="kpi"><div class="l">${lastM}월 회비 납부(진행중)</div><div class="v">${thisPaid} / ${d.members.length}명</div><div class="s">매월 말일까지 20,000원</div></div>
    <div class="kpi"><div class="l">지난 모임</div><div class="v">${lastMeet ? lastMeet.name : '-'}</div><div class="s">${lastMeet ? (lastMeet.date || '') + ' · ' + lastMeet.attendees.length + '명' : ''}</div></div>`;

  // 연도별
  const byY = {}; d.months.forEach((mm, i) => { byY[mm.y] = (byY[mm.y] || 0) + (d.totals.monthly[i] || 0); });
  const ys = Object.keys(byY).filter(y => byY[y] > 0), mx = Math.max(...ys.map(y => byY[y]));
  $('bars').innerHTML = ys.map(y => `<div class="bar"><b>${Math.round(byY[y] / 10000)}</b><i style="height:${byY[y] / mx * 120}px"></i><span>'${String(y).slice(2)}</span></div>`).join('');

  // 히트맵
  const cut = now.getFullYear() * 12 + now.getMonth();
  const idxNow = d.months.findIndex(x => x.y === lastY && x.m === lastM);
  const end = idxNow >= 0 ? idxNow : d.months.length - 1, start = Math.max(0, end - 11);
  const cols = d.months.slice(start, end + 1);
  let h = `<div class="c h"></div>` + cols.map(c => `<div class="c h">${c.m === 1 ? "'" + String(c.y).slice(2) + '.' : ''}${c.m}</div>`).join('');
  d.members.forEach(m => {
    h += `<div class="c nm">${m.name}</div>`;
    m.pays.slice(start, end + 1).forEach((p, i) => {
      const due = p.y * 12 + (p.m - 1) < cut;
      const before = m.join && (p.y * 12 + p.m < m.join.y * 12 + m.join.m);
      h += p.v > 0 ? `<div class="c p">✓</div>` : (due && !before ? `<div class="c x">!</div>` : `<div class="c e">·</div>`);
    });
  });
  $('heat').style.gridTemplateColumns = `62px repeat(${cols.length}, minmax(24px,1fr))`;
  $('heat').innerHTML = h;

  // 회원표
  $('mt').innerHTML = `<tr><th>이름</th><th class="n">누계</th><th class="n">사용</th><th class="n">참석</th><th>최근 납부</th><th>상태</th></tr>` +
    d.members.slice().sort((a, b) => b.total - a.total).map(m => `<tr><td><b>${m.name}</b></td><td class="n">${man(m.total)}</td><td class="n">${man(m.used)}</td><td class="n">${m.attend}회</td>
    <td>${m.lastPaid ? String(m.lastPaid.y).slice(2) + '.' + m.lastPaid.m : '-'}</td><td>${m.missing ? `<span class="pill no">미납 ${m.missing}</span>` : '<span class="pill ok">정상</span>'}</td></tr>`).join('');

  // 참석 순위
  const rk = d.members.slice().sort((a, b) => b.attend - a.attend), top = Math.max(1, rk[0].attend);
  $('rank').innerHTML = rk.map((m, i) => `<div class="rank"><div class="nm">${i < 3 ? ['🥇', '🥈', '🥉'][i] : ''}${m.name}</div><div class="bg"><i style="width:${m.attend / top * 100}%"></i></div><div class="cnt">${m.attend}</div></div>`).join('');

  // 타임라인
  $('tl').innerHTML = d.events.slice().reverse().map(e => {
    const fund = e.type === 'fund';
    const people = fund ? '' : `<div class="chips">${e.attendees.map(a => `<span class="chip ${/비회원/.test(a) ? 'g' : ''}">${a}</span>`).join('')}</div>`;
    const vend = (e.vendors || []).length ? `<div class="vend">${e.vendors.map(v => `<div><span>${v.name}</span><span>${won(v.amt)}</span></div>`).join('')}</div>` : '';
    return `<div class="ev ${fund ? 'fund' : ''}"><div class="t">${e.name}${fund ? '<span class="tag">환급</span>' : e.type === 'mt' ? '<span class="tag">MT</span>' : ''}</div>
      <div class="d">${e.date || ''}${e.place ? ' · ' + e.place : ''}${fund ? '' : ' · ' + e.attendees.length + '명'}</div><div class="amt">${man(e.total)}원</div>${people}${vend}</div>`;
  }).join('');

  // 회칙
  $('rules').innerHTML = '<h2>혈풍 86계 회칙</h2>' + d.rules.map(r => `<p class="${/^제\s*\d+\s*장/.test(r) ? 'hd' : ''}">${r.replace(/\s+/g, ' ')}</p>`).join('');
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['pay', 'meet', 'rule'].forEach(id => $(id).classList.toggle('hide', id !== b.dataset.t));
});

(async () => {
  let url = '';
  try { const t = await fetch('sheet.txt?t=' + Date.now()); if (t.ok) url = (await t.text()).trim(); } catch (e) {}
  if (!url.startsWith('http')) url = DATA_URL;
  if (url) {
    try {
      const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
      const wb = XLSX.read(await res.arrayBuffer(), { type: 'array' });
      const book = {}; wb.SheetNames.forEach(n => { const ws = wb.Sheets[n]; if (ws['!ref']) { const r = XLSX.utils.decode_range(ws['!ref']); r.s.r = 0; r.s.c = 0; ws['!ref'] = XLSX.utils.encode_range(r); } book[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }); });
      return render(parseBook(book, new Date()), '실시간 장부 연동');
    } catch (e) { console.warn('실시간 불러오기 실패, 저장본 표시', e); }
  }
  render(parseBook(SNAPSHOT, new Date()), '저장본 기준(실시간 연동 전)');
})();
